# 律 (Ritsu) — Arduino UNO Q 版バーチャルキャラクター (VRM + three.js + ROS 2)
#   renderer   : 静的ファイル(HTML / three.js / VRM)を nginx で配信
#                /llm/ を LiteLLM (CT201) へ中継し APIキーはサーバー側で付与、/rosbridge を rosbridge へ中継
#   rosbridge  : ROS 2 とブラウザ(画面の律・iPhone の入力ページ)をつなぐ WebSocket (9090)
#   perception : 深度カメラ(Orbbec Gemini 335)の人検出・傾き・マスターの顔の見分け ROS 2 ノード
#   memory     : 律の記憶(今日のこと・マスターとの話)と反応の記録を ./data に残す ROS 2 ノード
#   base       : 台車(メカナム4輪)。/cmd_vel を UNO Q の STM32 (arduino/ritsu-base) へ送り /odom を出す ROS 2 ノード
#   ROS 2 のノードはホストネットワーク + ipc: host (同じホスト内のDDS共有メモリ通信のため)。
#   台車のノードや別マシン(Jetson 等)の ROS 2 とも、同じネットワーク・同じ ROS_DOMAIN_ID ならつながる。

x-ros: &ros
  build: ./ros
  image: ritsu-ros
  restart: unless-stopped
  network_mode: host
  ipc: host

services:
  renderer:
    image: nginx:alpine
    container_name: ritsu-renderer
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file: .env                                  # LITELLM_URL / LITELLM_KEY
    environment:                                    # 律の声の中継先(CT200)。.env に書けば上書きできる
      - STT_URL=${STT_URL:-http://192.168.3.17:8100}
      - TTS_URL=${TTS_URL:-http://192.168.3.17:50021}
    extra_hosts:
      - "host.docker.internal:host-gateway"         # ホストネットワークの rosbridge へ中継するため
    volumes:
      - ./renderer:/usr/share/nginx/html:ro         # config.js / VRM は編集・差し替えしてリロードするだけ
      - ./nginx:/etc/nginx/templates:ro             # 起動時に .env の値を埋め込んで default.conf を生成

  rosbridge:
    <<: *ros
    container_name: ritsu-rosbridge
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    command: ["bash", "-c", "source /opt/ros/jazzy/setup.bash && exec ros2 launch rosbridge_server rosbridge_websocket_launch.xml port:=9090"]

  perception:
    <<: *ros
    container_name: ritsu-camera
    privileged: true                                # USBデバイスアクセス (Gemini 335)
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./renderer/debug:/app/debug                 # DEBUG_SNAPSHOT=1 のとき camera.jpg を保存(:8080/debug/camera.jpg)
      - ./data:/data                                # 登録したマスターの顔の特徴 (data/faces/master.npy)
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - CAMERA_ROTATE=${CAMERA_ROTATE:-0}           # カメラを縦置きしたとき 90/180/270
      - PERCEPTION_FPS=${PERCEPTION_FPS:-8}         # UNO Q の CPU に合わせた検出回数
      - DEBUG_SNAPSHOT=${DEBUG_SNAPSHOT:-0}
      - IMU_ROLL_SIGN=${IMU_ROLL_SIGN:--1}          # Gemini 335 実機では -1 で傾けた側へよろける
      - LOOK_YAW=${LOOK_YAW:-0.2}                   # 顔の向きがこれ以内なら「こちらを見ている」(大きいほど甘い)
      - TOUCH_DIST=${TOUCH_DIST:-0.45}              # [m] これより近い手に、律が内側から手を合わせる
      - MASTER_MATCH=${MASTER_MATCH:-0.40}          # 登録した顔とみなす類似度(上げるほど厳しい)
      - CAMERA_HEIGHT=${CAMERA_HEIGHT:-1.0}         # [m] 床からカメラまでの高さ(障害物と床を分ける)
      - CAMERA_PITCH_DEG=${CAMERA_PITCH_DEG:-0}     # [度] カメラの下向きの角度
      - ROBOT_HALF_WIDTH=${ROBOT_HALF_WIDTH:-0.2}   # [m] 台車の幅の半分+余裕(この内側の物が正面の障害物)
      - OBSTACLE_MIN=${OBSTACLE_MIN:-0.15}          # [m] これより近い深度は使わない(映り込む台車自身など)
    command: ["bash", "-c", "source /opt/ros/jazzy/setup.bash && exec python3 ritsu_perception.py"]

  memory:
    <<: *ros
    container_name: ritsu-memory
    volumes:
      - ./data:/data                                # memory.json(覚えていること) / log/日付.jsonl(反応の記録)
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - LEARN_DAYS=${LEARN_DAYS:-30}                # 反応の結果を何日分集計するか
      - TZ=${TZ:-Asia/Tokyo}                        # 記録の日付・時刻を日本時間にする
      - NEWS_FEEDS=${NEWS_FEEDS-top-picks,entertainment,sports,science,it}   # 話題にするニュースの種類(空で取らない)
    command: ["bash", "-c", "source /opt/ros/jazzy/setup.bash && exec python3 ritsu_memory.py"]

  base:
    <<: *ros
    container_name: ritsu-base
    volumes:
      - /var/run/arduino-router.sock:/var/run/arduino-router.sock   # STM32 と話す arduino-router (UNO Q の Linux 側)
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - WHEEL_DIAMETER=${WHEEL_DIAMETER:-0.08}      # [m] 車輪の直径
      - WHEEL_LX=${WHEEL_LX:-0.10}                  # [m] 車体の中心から前輪・後輪の軸まで
      - WHEEL_LY=${WHEEL_LY:-0.12}                  # [m] 車体の中心から左右の車輪まで
      - WHEEL_INVERT=${WHEEL_INVERT:-1,0,1,0}       # 向きが逆の車輪を 1 に(左前,右前,左後,右後)
      - MAX_LINEAR=${MAX_LINEAR:-0.3}               # [m/s]
      - MAX_ANGULAR=${MAX_ANGULAR:-1.2}             # [rad/s]
      - TURN_ENABLE=${TURN_ENABLE:-1}               # 律が反応するとき台車ごと人の方を向く(/remote でも切り替えられる)
      - TURN_MAX=${TURN_MAX:-0.4}                   # [rad/s] 向くときの回る速さの上限(0.4 ≒ 1秒に23度)
      - TURN_SIGN=${TURN_SIGN:-1}                   # 人から離れるように回ったら -1
      - MOVE_DIST=${MOVE_DIST:-0.15}                # [m] 「前に来て」「後ろに下がって」で動く距離
      - MOVE_TURN_DEG=${MOVE_TURN_DEG:-30}          # [度] 「左向いて」「右向いて」で回る角度
      - OBSTACLE_STOP=${OBSTACLE_STOP:-0.4}         # [m] 正面の障害物がこれより近いと前に進まない
    command: ["bash", "-c", "source /opt/ros/jazzy/setup.bash && exec python3 ritsu_base.py"]
