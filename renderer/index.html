<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>律 — Virtual Kanban Musume</title>
<style>
  :root {
    --sakura: #ffb7c5;
    --cream:  #fff6ec;
    --mint:   #bdeee2;
    --ink:    #5a4a52;
    --accent: #ff6f91;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--cream); font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Noto Sans JP", sans-serif; }
  #stage { position: fixed; inset: 0; }

  /* ---- 字幕(律の発話) ---- */
  #subtitle {
    position: fixed; left: 50%; bottom: 130px; transform: translateX(-50%);
    max-width: 86%; padding: 14px 22px; border-radius: 24px;
    background: rgba(255,255,255,0.92); color: var(--ink);
    font-size: 22px; line-height: 1.5; text-align: center;
    box-shadow: 0 6px 24px rgba(255,111,145,0.25);
    opacity: 0; transition: opacity .3s; z-index: 10; pointer-events: none;
  }
  #subtitle.show { opacity: 1; }
  #subtitle::after {
    content: ""; position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    border: 8px solid transparent; border-bottom-color: rgba(255,255,255,0.92);
  }

  /* ---- チャット入力 ---- */
  #chatbar {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    width: min(88%, 640px); display: flex; gap: 10px; z-index: 10;
  }
  #chatbar input {
    flex: 1; padding: 14px 20px; border-radius: 999px; border: 2px solid var(--sakura);
    font-size: 18px; color: var(--ink); background: rgba(255,255,255,0.9); outline: none;
  }
  #chatbar input:focus { border-color: var(--accent); }
  #chatbar input { min-width: 0; }
  #chatbar button {
    flex-shrink: 0; white-space: nowrap;
    padding: 0 26px; border: none; border-radius: 999px; background: var(--accent);
    color: white; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  #chatbar button:active { transform: scale(0.96); }

  /* ---- ステータスランプ ---- */
  #status {
    position: fixed; top: 20px; right: 18px; display: flex; flex-direction: column; gap: 6px;
    font-size: 11px; color: var(--ink); z-index: 10; opacity: 0.8;
  }
  #status .lamp { display: flex; align-items: center; gap: 6px; }
  #status .dot  { width: 9px; height: 9px; border-radius: 50%; background: #ccc; }
  #status .on   { background: #57d9a3; box-shadow: 0 0 6px #57d9a3; }
</style>
</head>
<body>
<div id="stage"></div>

<div id="subtitle"></div>

<div id="chatbar">
  <input id="chat-input" type="text" placeholder="話しかける…" autocomplete="off">
  <button id="chat-send">送信</button>
</div>

<div id="status">
  <div class="lamp"><div class="dot" id="lamp-llm"></div>LLM</div>
  <div class="lamp"><div class="dot" id="lamp-mqtt"></div>MQTT</div>
</div>

<script src="config.js"></script>
<!-- three.js / three-vrm / mqtt.js : オフライン運用時は js/vendor/ に配置して差し替え -->
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.5/dist/mqtt.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.3/lib/three-vrm.module.min.js"
  }
}
</script>
<script type="module" src="js/boot.js"></script>
</body>
</html>
