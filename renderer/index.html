<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>律 — Virtual Kanban Musume</title>
<style>
  :root {
    --sakura: #ffb7c5;
    --cream:  #fff6ec;
    --mint:   #bdeee2;
    --ink:    #5a4a52;
    --accent: #ff6f91;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--cream); font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Noto Sans JP", sans-serif; }
  #stage { position: fixed; inset: 0; }

  /* ---- 吹き出し(律の発話) ----
     縦置きの小さめモニター(高さ約400mm)で読みやすいよう、画面上部に大きな文字で出す。
     文字の大きさは画面幅に合わせる(縦置き1080px幅で54px) */
  #subtitle {
    position: fixed; left: 50%; top: max(70px, 5vh); transform: translate(-50%, -12px) scale(0.96);
    width: max-content; max-width: 84%; padding: 0.55em 0.9em; border-radius: 0.9em;
    background: rgba(255,255,255,0.96); color: var(--ink);
    border: max(3px, 0.4vw) solid var(--sakura);
    font-size: clamp(24px, 5vw, 64px); font-weight: 700; line-height: 1.4;
    text-align: left; word-break: normal; overflow-wrap: anywhere; line-break: strict;
    box-shadow: 0 0.25em 1em rgba(255,111,145,0.3);
    opacity: 0; transition: opacity .25s, transform .25s; z-index: 10; pointer-events: none;
  }
  #subtitle.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  /* しっぽ(下の律へ向ける) */
  #subtitle::before, #subtitle::after {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    border-style: solid; border-color: transparent;
  }
  #subtitle::before { top: 100%; border-width: 0.55em 0.45em 0; border-top-color: var(--sakura); }
  #subtitle::after  { top: calc(100% - max(3px, 0.4vw) * 1.6); border-width: 0.45em 0.36em 0; border-top-color: rgba(255,255,255,0.96); }

  /* ---- チャット入力 ---- */
  #chatbar {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    width: min(88%, 640px); display: flex; gap: 10px; z-index: 10;
  }
  #chatbar input {
    flex: 1; padding: 14px 20px; border-radius: 999px; border: 2px solid var(--sakura);
    font-size: 18px; color: var(--ink); background: rgba(255,255,255,0.9); outline: none;
  }
  #chatbar input:focus { border-color: var(--accent); }
  #chatbar input { min-width: 0; }
  #chatbar button {
    flex-shrink: 0; white-space: nowrap;
    padding: 0 26px; border: none; border-radius: 999px; background: var(--accent);
    color: white; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  #chatbar button:active { transform: scale(0.96); }

  /* ---- ステータスランプ ---- */
  /* 左上に横並び。モニターから離れて見ても読めるよう画面幅に合わせた大きさ(縦置き1080px幅で約28px)。
     吹き出し(top: 5vh〜)より上に収める */
  #status {
    position: fixed; top: 1.2vh; left: 2.5vw; display: flex; gap: 1.2em;
    font-size: clamp(13px, 2.6vw, 32px); font-weight: 700; color: var(--ink); z-index: 11;
  }
  #status .lamp { display: flex; align-items: center; gap: 0.35em; }
  #status .dot  { width: 0.75em; height: 0.75em; border-radius: 50%; background: #ccc; border: 2px solid rgba(90,74,82,0.25); }
  #status .on   { background: #57d9a3; box-shadow: 0 0 0.4em #57d9a3; border-color: transparent; }
  #status .idle { background: #f2c14e; box-shadow: 0 0 0.4em #f2c14e; border-color: transparent; }
</style>
</head>
<body>
<div id="stage"></div>

<div id="subtitle"></div>

<div id="chatbar">
  <input id="chat-input" type="text" placeholder="話しかける…" autocomplete="off">
  <button id="chat-send">送信</button>
</div>

<div id="status">
  <div class="lamp"><div class="dot" id="lamp-llm"></div>LLM</div>
  <div class="lamp"><div class="dot" id="lamp-ros"></div>ROS</div>
  <div class="lamp"><div class="dot" id="lamp-cam"></div>CAMERA</div>
</div>

<script src="config.js"></script>
<!-- three.js / three-vrm / roslib.js : オフライン運用時は js/vendor/ に配置して差し替え -->
<script src="https://cdn.jsdelivr.net/npm/roslib@1.4.1/build/roslib.min.js"></script>
<script src="js/ros.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.3/lib/three-vrm.module.min.js"
  }
}
</script>
<script type="module" src="js/boot.js"></script>
</body>
</html>
