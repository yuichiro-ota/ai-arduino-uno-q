<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff6ec">
<title>律と話す</title>
<style>
  :root {
    --sakura: #ffb7c5;
    --cream:  #fff6ec;
    --ink:    #5a4a52;
    --accent: #ff6f91;
    --muted:  #a8979f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column;
    background: var(--cream); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    border-bottom: 1px solid #f3e1e6; background: rgba(255,246,236,0.95);
  }
  header h1 { font-size: 18px; font-weight: 800; letter-spacing: 0.08em; }
  #conn { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  #conn .dot { width: 9px; height: 9px; border-radius: 50%; background: #ccc; }
  #conn.on .dot { background: #57d9a3; box-shadow: 0 0 6px #57d9a3; }
  header .right { display: flex; align-items: center; gap: 12px; }
  #master-btn, .hbtn { border: 1px solid var(--sakura); background: #fff; color: var(--ink); border-radius: 999px;
                padding: 4px 10px; font-size: 12px; }

  /* マスターの顔の登録 */
  #master { display: none; padding: 12px 16px; background: #fff; border-bottom: 1px solid #f3e1e6; font-size: 14px; line-height: 1.6; }
  #master.show { display: block; }
  #master .row { display: flex; gap: 8px; margin-top: 8px; }
  #master button { flex: 1; padding: 10px; border-radius: 999px; border: none; font-size: 14px; font-weight: 700; }
  #enroll-add { background: var(--accent); color: #fff; }
  #enroll-clear { background: #f3e1e6; color: var(--ink); }
  #enroll-state { margin-top: 6px; color: var(--muted); font-size: 13px; min-height: 1.6em; }

  /* マイクの様子(kiosk 画面の律が1秒ごとに送る) */
  #mic { display: none; padding: 12px 16px; background: #fff; border-bottom: 1px solid #f3e1e6; font-size: 13px; line-height: 1.7; }
  #mic.show { display: block; }
  #mic .bar { position: relative; height: 12px; background: #f3e1e6; border-radius: 6px; overflow: hidden; margin: 4px 0; }
  #mic .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #57d9a3; }
  #mic .bar b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); }
  #mic dl { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; }
  #mic dt { color: var(--muted); }
  #mic dd { word-break: break-all; }

  #log {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 18px; line-height: 1.5; font-size: 16px; word-break: break-word; }
  .msg.ritsu { align-self: flex-start; background: #fff; box-shadow: 0 2px 10px rgba(255,111,145,0.15); border-bottom-left-radius: 6px; }
  .msg.ritsu.idle { color: var(--muted); font-size: 14px; }
  .msg.me    { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 6px; }
  .msg.other { align-self: flex-end; background: #f3e1e6; border-bottom-right-radius: 6px; }
  .who { font-size: 11px; color: var(--muted); margin-bottom: -6px; }
  .who.right { align-self: flex-end; }
  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.8; }

  #thinking { align-self: flex-start; display: none; gap: 5px; padding: 12px 16px; background: #fff; border-radius: 18px; }
  #thinking.show { display: flex; }
  #thinking span { width: 7px; height: 7px; border-radius: 50%; background: var(--sakura); animation: blink 1.2s infinite; }
  #thinking span:nth-child(2) { animation-delay: .2s; }
  #thinking span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }

  form {
    display: flex; gap: 8px;
    padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
    border-top: 1px solid #f3e1e6; background: #fff;
  }
  form input {
    flex: 1; min-width: 0; padding: 12px 16px; border-radius: 999px;
    border: 2px solid var(--sakura); font-size: 16px; color: var(--ink); outline: none; background: #fff;
  }
  form input:focus { border-color: var(--accent); }
  form button {
    flex-shrink: 0; white-space: nowrap;
    padding: 0 20px; border: none; border-radius: 999px; background: var(--accent);
    color: #fff; font-size: 16px; font-weight: 700;
  }
  form button:disabled { opacity: .45; }
</style>
</head>
<body>
<header>
  <h1>律と話す</h1>
  <div class="right">
    <button id="mic-btn" class="hbtn" type="button">マイク</button>
    <button id="master-btn" type="button">マスター登録</button>
    <div id="conn"><div class="dot"></div><span id="conn-text">接続中…</span></div>
  </div>
</header>

<section id="master">
  カメラの正面に立ち、顔をカメラに向けたまま「登録」を押して約4秒じっとしてください。
  明るさや向きを変えて何回か登録すると、見分けやすくなります。顔の画像は保存せず、見分けるための数値だけを律の本体に保存します。
  <div class="row">
    <button id="enroll-add" type="button">登録</button>
    <button id="enroll-clear" type="button">登録を消す</button>
  </div>
  <div id="enroll-state"></div>
</section>

<section id="mic">
  <div id="mic-state">律の画面からの知らせを待っています…</div>
  <div class="bar"><i id="mic-level"></i><b id="mic-th"></b></div>
  <dl>
    <dt>聞いている</dt><dd id="mic-listen">-</dd>
    <dt>最後に聞いた</dt><dd id="mic-heard">-</dd>
    <dt>捨てた</dt><dd id="mic-ignored">-</dd>
    <dt>失敗</dt><dd id="mic-error">-</dd>
    <dt>マイク</dt><dd id="mic-device">-</dd>
  </dl>
</section>

<main id="log">
  <div class="empty" id="empty">話しかけると、画面の律が答えます。</div>
  <div id="thinking"><span></span><span></span><span></span></div>
</main>

<form id="form" autocomplete="off">
  <input id="input" type="text" placeholder="話しかける…" maxlength="200" enterkeyhint="send">
  <button id="send" type="submit" disabled>送信</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/roslib@1.4.1/build/roslib.min.js"></script>
<script src="js/ros.js"></script>
<script>
/* remote.html — iPhone などから律に話しかける入力ページ
 *   ROS 2 の /ritsu/chat_user に送信し、画面の律(kiosk)が返した /ritsu/say を履歴に表示する */
(() => {
  const myId = 'remote-' + Math.random().toString(36).slice(2, 10);
  const log = document.getElementById('log');
  const empty = document.getElementById('empty');
  const thinking = document.getElementById('thinking');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const conn = document.getElementById('conn');
  const connText = document.getElementById('conn-text');

  function add(cls, text, who) {
    empty.remove();
    if (who) {
      const w = document.createElement('div');
      w.className = 'who' + (cls === 'ritsu' || cls.startsWith('ritsu') ? '' : ' right');
      w.textContent = who;
      log.insertBefore(w, thinking);
    }
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;
    log.insertBefore(el, thinking);
    log.scrollTop = log.scrollHeight;
  }

  const ros = new RitsuRos(null, ok => {
    conn.classList.toggle('on', ok);
    connText.textContent = ok ? '接続' : '再接続中…';
    sendBtn.disabled = !ok;
  });
  const parse = data => { try { return JSON.parse(data); } catch { return { text: data }; } };

  ros.sub('/ritsu/chat_user', 'std_msgs/String', m => {
    const msg = parse(m.data);
    if (typeof msg.text !== 'string') return;
    if (msg.from === myId) add('me', msg.text);
    else add('other', msg.text, msg.from === 'screen' ? '画面から' : msg.from === 'voice' ? '声で' : 'ほかの人');
  });
  ros.sub('/ritsu/say', 'std_msgs/String', m => {
    const msg = parse(m.data);
    if (typeof msg.text === 'string') add(String(msg.source).startsWith('idle') ? 'ritsu idle' : 'ritsu', msg.text, '律');
  });
  ros.sub('/ritsu/thinking', 'std_msgs/Bool', m => {
    thinking.classList.toggle('show', !!m.data);
    log.scrollTop = log.scrollHeight;
  });

  // マスターの顔の登録(カメラのノードが /ritsu/enroll を受けて、結果を /ritsu/enroll_status で返す)
  const masterPanel = document.getElementById('master');
  const enrollState = document.getElementById('enroll-state');
  const enroll = action => {
    if (ros.pub('/ritsu/enroll', 'std_msgs/String', { data: JSON.stringify({ action }) })) enrollState.textContent = '送信しました…';
    else enrollState.textContent = 'つながっていません';
  };
  document.getElementById('master-btn').addEventListener('click', () => masterPanel.classList.toggle('show'));
  document.getElementById('enroll-add').addEventListener('click', () => enroll('add'));
  document.getElementById('enroll-clear').addEventListener('click', () => {
    if (confirm('登録したマスターの顔を消しますか?')) enroll('clear');
  });
  ros.sub('/ritsu/enroll_status', 'std_msgs/String', m => {
    const st = parse(m.data);
    enrollState.textContent = { capturing: `撮影中… ${st.count}枚`, done: `登録しました(全部で${st.count}枚分)`,
                                failed: '顔が見つかりませんでした。カメラの正面で、もう一度どうぞ', cleared: '登録を消しました' }[st.state] || '';
  });

  // マイクの様子: 緑の棒が音の大きさ(1秒間で一番大きいところ)、赤い線が「声」とみなす大きさ
  const micPanel = document.getElementById('mic');
  const $ = id => document.getElementById(id);
  const ago = t => `${Math.round((Date.now() - t) / 1000)}秒前`;
  let micAt = 0, micFrames = -1;
  document.getElementById('mic-btn').addEventListener('click', () => micPanel.classList.toggle('show'));
  ros.sub('/ritsu/voice_status', 'std_msgs/String', m => {
    const st = parse(m.data);
    const flowing = st.frames !== micFrames;
    micFrames = st.frames;
    micAt = Date.now();
    const scale = v => Math.min(100, v * 1000);    // 0.1 で端まで
    $('mic-level').style.width = scale(st.peak) + '%';
    $('mic-th').style.left = scale(st.threshold) + '%';
    $('mic-state').textContent = st.audio !== 'running' ? `音が止まっています(${st.audio})。画面を一度タップしてください`
      : !flowing ? `マイクの音が届いていません(取り込み: ${st.capture || 'なし'})`
      : `音 ${st.peak.toFixed(3)} / 声とみなす ${st.threshold.toFixed(3)}(取り込み: ${st.capture})`;
    $('mic-listen').textContent = st.listening ? 'はい' : `いいえ(${st.why || '-'})`;
    $('mic-heard').textContent = st.heard ? `「${st.heard.text}」 ${st.heard.sec}秒の声 ${ago(st.heard.at)}` : '-';
    $('mic-ignored').textContent = st.ignored ? `「${st.ignored.text}」 ${ago(st.ignored.at)}` : '-';
    $('mic-error').textContent = st.error ? `${st.error.text} ${ago(st.error.at)}` : '-';
    $('mic-device').textContent = st.device || '-';
  });
  setInterval(() => {
    if (micAt && Date.now() - micAt > 3000) $('mic-state').textContent = '律の画面から知らせが来ていません(声を使っていないか、止まっている)';
  }, 1000);

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    if (!ros.pub('/ritsu/chat_user', 'std_msgs/String', { data: JSON.stringify({ text, from: myId }) })) return;
    input.value = '';
  });
})();
</script>
</body>
</html>
