<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff6ec">
<title>律と話す</title>
<style>
  :root {
    --sakura: #ffb7c5;
    --cream:  #fff6ec;
    --ink:    #5a4a52;
    --accent: #ff6f91;
    --muted:  #a8979f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column;
    background: var(--cream); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    border-bottom: 1px solid #f3e1e6; background: rgba(255,246,236,0.95);
  }
  header h1 { font-size: 18px; font-weight: 800; letter-spacing: 0.08em; }
  #conn { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  #conn .dot { width: 9px; height: 9px; border-radius: 50%; background: #ccc; }
  #conn.on .dot { background: #57d9a3; box-shadow: 0 0 6px #57d9a3; }

  #log {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 18px; line-height: 1.5; font-size: 16px; word-break: break-word; }
  .msg.ritsu { align-self: flex-start; background: #fff; box-shadow: 0 2px 10px rgba(255,111,145,0.15); border-bottom-left-radius: 6px; }
  .msg.ritsu.idle { color: var(--muted); font-size: 14px; }
  .msg.me    { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 6px; }
  .msg.other { align-self: flex-end; background: #f3e1e6; border-bottom-right-radius: 6px; }
  .who { font-size: 11px; color: var(--muted); margin-bottom: -6px; }
  .who.right { align-self: flex-end; }
  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.8; }

  #thinking { align-self: flex-start; display: none; gap: 5px; padding: 12px 16px; background: #fff; border-radius: 18px; }
  #thinking.show { display: flex; }
  #thinking span { width: 7px; height: 7px; border-radius: 50%; background: var(--sakura); animation: blink 1.2s infinite; }
  #thinking span:nth-child(2) { animation-delay: .2s; }
  #thinking span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }

  form {
    display: flex; gap: 8px;
    padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
    border-top: 1px solid #f3e1e6; background: #fff;
  }
  form input {
    flex: 1; min-width: 0; padding: 12px 16px; border-radius: 999px;
    border: 2px solid var(--sakura); font-size: 16px; color: var(--ink); outline: none; background: #fff;
  }
  form input:focus { border-color: var(--accent); }
  form button {
    flex-shrink: 0; white-space: nowrap;
    padding: 0 20px; border: none; border-radius: 999px; background: var(--accent);
    color: #fff; font-size: 16px; font-weight: 700;
  }
  form button:disabled { opacity: .45; }
</style>
</head>
<body>
<header>
  <h1>律と話す</h1>
  <div id="conn"><div class="dot"></div><span id="conn-text">接続中…</span></div>
</header>

<main id="log">
  <div class="empty" id="empty">話しかけると、画面の律が答えます。</div>
  <div id="thinking"><span></span><span></span><span></span></div>
</main>

<form id="form" autocomplete="off">
  <input id="input" type="text" placeholder="話しかける…" maxlength="200" enterkeyhint="send">
  <button id="send" type="submit" disabled>送信</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.5/dist/mqtt.min.js"></script>
<script>
/* remote.html — iPhone などから律に話しかける入力ページ
 *   chat/user に送信し、画面の律(kiosk)が返した avatar/say を履歴に表示する */
(() => {
  const myId = 'remote-' + Math.random().toString(36).slice(2, 10);
  const log = document.getElementById('log');
  const empty = document.getElementById('empty');
  const thinking = document.getElementById('thinking');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const conn = document.getElementById('conn');
  const connText = document.getElementById('conn-text');

  function add(cls, text, who) {
    empty.remove();
    if (who) {
      const w = document.createElement('div');
      w.className = 'who' + (cls === 'ritsu' || cls.startsWith('ritsu') ? '' : ' right');
      w.textContent = who;
      log.insertBefore(w, thinking);
    }
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;
    log.insertBefore(el, thinking);
    log.scrollTop = log.scrollHeight;
  }

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const mq = mqtt.connect(`${proto}://${location.host}/mqtt`, { reconnectPeriod: 3000 });

  mq.on('connect', () => {
    conn.classList.add('on'); connText.textContent = '接続';
    sendBtn.disabled = false;
    mq.subscribe(['chat/user', 'avatar/say', 'avatar/thinking']);
  });
  mq.on('close', () => {
    conn.classList.remove('on'); connText.textContent = '再接続中…';
    sendBtn.disabled = true;
  });

  mq.on('message', (topic, payload) => {
    let msg;
    try { msg = JSON.parse(payload.toString()); } catch { return; }
    if (typeof msg !== 'object' || msg === null) return;
    if (topic === 'chat/user' && typeof msg.text === 'string') {
      if (msg.from === myId) add('me', msg.text);
      else add('other', msg.text, msg.from === 'screen' ? '画面から' : 'ほかの人');
    } else if (topic === 'avatar/say' && typeof msg.text === 'string') {
      add(msg.source === 'idle' ? 'ritsu idle' : 'ritsu', msg.text, '律');
    } else if (topic === 'avatar/thinking') {
      thinking.classList.toggle('show', !!msg.on);
      log.scrollTop = log.scrollHeight;
    }
  });

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !mq.connected) return;
    mq.publish('chat/user', JSON.stringify({ text, from: myId }));
    input.value = '';
  });
})();
</script>
</body>
</html>
