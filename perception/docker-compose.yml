# 深度カメラ(Orbbec Gemini 335)の人検出。律の画面とは別に起動する。
#   開発PC(WSL)で動かすとき : そのまま docker compose up -d --build (UNO Q の MQTT へ送る)
#   UNO Q 上で動かすとき     : MQTT_HOST=127.0.0.1 docker compose up -d --build
services:
  perception:
    build: .
    container_name: ritsu-camera
    restart: unless-stopped
    privileged: true              # USBデバイスアクセス (Gemini 335)
    network_mode: host
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ../renderer/debug:/app/debug          # DEBUG_SNAPSHOT=1 のとき camera.jpg を保存(:8080/debug/camera.jpg)
    environment:
      - MQTT_HOST=${MQTT_HOST:-192.168.3.80}
      - CAMERA_ROTATE=${CAMERA_ROTATE:-0}   # カメラを縦置きしたとき 90/180/270
      - PERCEPTION_FPS=${PERCEPTION_FPS:-15}
      - DEBUG_SNAPSHOT=${DEBUG_SNAPSHOT:-0}
      - IMU_ROLL_SIGN=${IMU_ROLL_SIGN:--1}  # Gemini 335 実機では -1 で傾けた側へよろける
